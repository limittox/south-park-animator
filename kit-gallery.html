<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Set Kit Gallery (dev)</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #eef1f4; color: #1d1d1d; }
      h1, h2 { margin: 16px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; padding: 0 16px 16px; }
      .cell { background: #fff; border: 2px solid #1d1d1d; border-radius: 10px; padding: 6px; }
      .cell svg { width: 100%; height: 160px; display: block; }
      .cell .nm { font-size: 12px; font-weight: 700; text-align: center; }
      .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 12px; padding: 0 16px 24px; }
      .set { background: #fff; border: 2px solid #1d1d1d; border-radius: 10px; padding: 6px; }
      .set svg { width: 100%; display: block; }
      .set .nm { font-weight: 700; margin: 4px 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/sets/gallery-main.tsx"></script>
  </body>
</html>
